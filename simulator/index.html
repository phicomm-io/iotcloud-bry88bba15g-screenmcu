<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BRY88BBA15G · 屏幕设计预览</title>
<style>body{margin:0;background:#071219;color:#e9f5ef;font:16px system-ui;display:grid;justify-content:center;gap:16px;padding:24px}header,footer{max-width:480px}h1{font-size:21px}button,select{font:inherit;background:#14252e;color:inherit;border:1px solid #344851;border-radius:12px;padding:10px}img{width:min(480px,90vw);height:auto;border-radius:20px;touch-action:manipulation}nav{display:flex;gap:12px}small{color:#96aab1}</style>
<header><h1>BRY88BBA15G · 屏幕设计预览</h1><p>单击下一页，双击回时钟；左右方向键翻页。</p><label>数据状态 <select id="mode"><option value="0">离线／无数据</option><option value="1">演示数据</option></select></label> <label>外部组件 <select id="widget"><option value="0">数值</option><option value="1">文字</option><option value="2">折线</option><option value="3">柱状</option><option value="4" selected>饼图</option></select></label></header>
<img id="screen" alt="480×854 LVGL 屏幕预览"><nav><button id="prev">上一页</button><button id="home">时钟</button><button id="next">下一页</button></nav><footer><small>由固件同一份 LVGL 界面代码渲染。设置项目前仅作布局预览，尚不能配置硬件。</small></footer>
<script>let page=0,timer;const image=document.querySelector('#screen'),mode=document.querySelector('#mode'),widget=document.querySelector('#widget');function draw(){image.src=`/screen.png?page=${page}&demo=${mode.value}&widget=${widget.value}`;}function move(n){page=(page+n+5)%5;draw()}image.onclick=()=>{clearTimeout(timer);timer=setTimeout(()=>move(1),250)};image.ondblclick=()=>{clearTimeout(timer);page=0;draw()};document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#home').onclick=()=>{page=0;draw()};mode.onchange=draw;widget.onchange=()=>{page=3;draw()};document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='Home'){page=0;draw()}};draw();</script></html>
